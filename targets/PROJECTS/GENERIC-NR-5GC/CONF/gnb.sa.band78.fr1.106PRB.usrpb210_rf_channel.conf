Active_gNBs = ( "gnb-rfsim");
# Asn1_verbosity, choice in: none, info, annoying
# for the channel condition simluation
Asn1_verbosity = "info";

# The id area
gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID    =  0xe00;
    # The industual cell -> like factory buliding number


    # cell_type = "CELL_MACRO_GNB"
    gNB_name  =  "gnb-rfsim";

    // Tracking area code, 0x0000 and 0xfffe are reserved values
    tracking_area_code  =  1;
    # The industral area

    plmn_list = ({ mcc = 001; mnc = 01; mnc_length = 2; snssaiList = ({ sst = 1; }) });
    # The city
    # cooperate the cn5g configration

    nr_cellid = 12345678L;

    min_rxtxtime = 6;
    # prof the system time sequncel correct

    # tr_s_preference = "local_mac"
    ////////// Physical parameters:

    do_CSIRS                                                  = 1;
    do_SRS                                                    = 1;

    #uess_agg_levels = [0,1,2,2,1]

    # This area begin is specy the product line spefication 
    # The parmeter is include the frequency bandwith and the child band range
    servingCellConfigCommon = (
    {
 #spCellConfigCommon

      physCellId                                                    = 0;

#  downlinkConfigCommon
    #frequencyInfoDL
      # this is 3600 MHz + 43 PRBs@30kHz SCS (same as initial BWP)
      # The modify point
      absoluteFrequencySSB                                             = 621312; 
      dl_frequencyBand                                                 = 78;
      # this is 3600 MHz
      # the SRB begin frequecncy  mod2 point
      dl_absoluteFrequencyPointA                                       = 620040;
      #scs-SpecificCarrierList
        dl_offstToCarrier                                              = 0;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        dl_subcarrierSpacing                                           = 1;
        dl_carrierBandwidth                                            = 106;
     #initialDownlinkBWP
      #genericParameters
        # this is RBstart=27,L=48 (275*(L-1))+RBstart

        initialDLBWPlocationAndBandwidth                               = 28875; # 6366 12925 12956 28875 12952


# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        initialDLBWPsubcarrierSpacing                                   = 1;
      #pdcch-ConfigCommon
      #The modiy point 3 -> need research
        initialDLBWPcontrolResourceSetZero                              = 11;
        initialDLBWPsearchSpaceZero                                     = 0;



  #uplinkConfigCommon
     #frequencyInfoUL
      ul_frequencyBand                                              = 78;
      #scs-SpecificCarrierList
      ul_offstToCarrier                                             = 0;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      ul_subcarrierSpacing                                          = 1;
      ul_carrierBandwidth                                           = 106;
      pMax                                                          = 20;
     #initialUplinkBWP
      #genericParameters
        initialULBWPlocationAndBandwidth                            = 28875;
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        initialULBWPsubcarrierSpacing                               = 1;
      #rach-ConfigCommon
        #rach-ConfigGeneric
          prach_ConfigurationIndex                                  = 98;
          # 設定 prach 的位置，讓ue可以接入訊號
#prach_msg1_FDM
#0 = one, 1=two, 2=four, 3=eight
          prach_msg1_FDM                                            = 0;
          # 類似收貨車道, 3 最多同時可以有8組來競爭
          prach_msg1_FrequencyStart                                 = 0;
          # prach 的起始頻率（也就是 我創的第一條收貨線從哪個門牌開始
          zeroCorrelationZoneConfig                                 = 12;
          # 門牌的隔離寬度,防止混淆
          preambleReceivedTargetPower                               = -104;
          # ue 接到基地台的進入功率限制 （我送前導碼的對應功率）
#preamblTransMax (0...10) = (3,4,5,6,7,8,10,20,50,100,200)
          preambleTransMax                                          = 6;
          # ue 最多可以重送幾次前導碼
#powerRampingStep
# 0=dB0,1=dB2,2=dB4,3=dB6
        powerRampingStep                                            = 1;
        # 每重送一次，功率加多少

#ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR 
#1=oneeighth,2=onefourth,3=half,4=one,5=two,6=four,7=eight,8=sixteen

# 每個 ssb 可以掛多少 多少號碼牌給ue 競爭
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                = 4;

#one (0..15) 4,8,12,16,...60,64
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB                   = 15;

#ra_ContentionResolutionTimer
#(0..7) 8,16,24,32,40,48,56,64

        ra_ContentionResolutionTimer                                = 7;
        # 發完 RACH後 , 等待時間（也就是下一輪是什麼時候開始發）
        rsrp_ThresholdSSB                                           = 19;
        # ue 敲門的限制 （SSB RSRP 高過某個門檻時才可以給敲門）
#prach-RootSequenceIndex_PR
#1 = 839, 2 = 139
        prach_RootSequenceIndex_PR                                  = 2;
        prach_RootSequenceIndex                                     = 1;
        # SCS for msg1, can only be 15 for 30 kHz < 6 GHz, takes precendence over the one derived from prach-ConfigIndex
        #
        msg1_SubcarrierSpacing                                      = 1,
        # 用於對齊你傳輸 的SCS 大小 1 = 30KHZ
# restrictedSetConfig
# 0=unrestricted, 1=restricted type A, 2=restricted type B
        restrictedSetConfig                                         = 0,

        msg3_DeltaPreamble                                          = 1;
        # 計算 Msg3 相對於 Preamble 的發射功率增量，確保真正送資料時比敲門時更大聲一點
        p0_NominalWithGrant                                         =-90;

# pucch-ConfigCommon setup :
# pucchGroupHopping The uplink control signl
# 0 = neither, 1= group hopping, 2=sequence hopping
        pucchGroupHopping                                           = 0; 
        # 關閉群組跳頻（Group Hopping），讓控制訊號序列規律單純，適合除錯與穩定環境
        hoppingId                                                   = 40;
        # 換機台的規律
        p0_nominal                                                  = -90;
        # pucch 的基本功率大小
      ssb_PositionsInBurst_Bitmap                                   = 1;

# ssb_periodicityServingCell
# 0 = ms5, 1=ms10, 2=ms20, 3=ms40, 4=ms80, 5=ms160, 6=spare2, 7=spare1
      ssb_periodicityServingCell                                    = 2;
      # 工廠大聲公 每20 毫秒發送一次自己的位置
# dmrs_TypeA_position
# 0 = pos2, 1 = pos3
      dmrs_TypeA_Position                                           = 0;
      # 量測下行通路的信號要放在第幾個位置中 （下行通路的抽樣計畫）
      # 這邊的位置通常是指 omfd 符號
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
      subcarrierSpacing                                             = 1;
      # 工作站之間的距離 （OFDM 每個子載波的間距）

  #tdd-UL-DL-ConfigurationCommon
# subcarrierSpacing
# 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120


#The scheduleing scheduleing 
      referenceSubcarrierSpacing                                    = 1;
      # pattern1
      # dl_UL_TransmissionPeriodicity
      # 0=ms0p5, 1=ms0p625, 2=ms1, 3=ms1p25, 4=ms2, 5=ms2p5, 6=ms5, 7=ms10
      dl_UL_TransmissionPeriodicity                                 = 6; # The scheduleing  cycle (mean the slot long is 5ms) 
      nrofDownlinkSlots                                             = 7; # for downlink slot amount
      nrofDownlinkSymbols                                           = 6; 
      nrofUplinkSlots                                               = 2; # for uplink slot amount
      nrofUplinkSymbols                                             = 4;

      ssPBCH_BlockPower                                             = -25;
      # 場內大聲公廣播音量
  }

  );


    # ------- SCTP definitions
    # 網路控制中心
    SCTP :
    {
        # Number of streams to use in input/output
        # gNB & AMF 之間傳  NGAP 訊息 協定
        #建立兩條平行的傳輸管線，避免某一類訊息（如 handover）卡住時影響其他訊息傳送
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };


    ////////// AMS parameters:
    amf_ip_address = ({ ipv4 = "192.168.70.132"; });
    # 指向 CN5G 的位置


    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF              = "192.168.70.129/24";
        # 給 AMF 出口門牌 也就是工廠地址
        GNB_IPV4_ADDRESS_FOR_NGU                 = "192.168.70.129/24";
        # gNB 用於 N3 介面（使用者資料面）的 IP，負責收發使用者上網流量（連到 UPF）
        GNB_PORT_FOR_S1U                         = 2152; # Spec 2152
        # 傳輸使用者資料的Port
    };

  }
);

MACRLCs = (
{
  num_cc                      = 1; # 只啟用一個載波
  tr_s_preference             = "local_L1"; # MAC/RLC/RRC 互連方式都在本機 延遲最小
  tr_n_preference             = "local_RRC";
  pusch_TargetSNRx10          = 200; # 150 -> 15 dB   上傳數據/訊號控制的目標功率 跟 QOS 相關 研究
  pucch_TargetSNRx10          = 200; # 200 -> 20 dB 
}
);

L1s = (
{
  num_cc = 1;
  tr_n_preference       = "local_mac";
  prach_dtx_threshold   = 120; 
  # 能量門檻值（dB），低於此值視為雜訊/無訊號（DTX），高於此值才視為有人在發送 PRACH
