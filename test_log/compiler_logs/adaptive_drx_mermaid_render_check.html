<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Adaptive DRX Mermaid render check</title>
    <script src="file:///home/tonywang/.vscode/extensions/shd101wyy.markdown-preview-enhanced-0.8.30/crossnote/dependencies/mermaid/mermaid.min.js"></script>
  </head>
  <body>
    <main id="diagrams"></main>
    <output id="result">PENDING</output>
    <script>
      const manuals = [
        "../../agent_doc/Project_management/projects/redcap_dapp_xapp_sdk_test_validation_v1/Doc/adaptive_drx_ab_manual_reproduction.en.md",
        "../../agent_doc/Project_management/projects/redcap_dapp_xapp_sdk_test_validation_v1/Doc/adaptive_drx_ab_manual_reproduction.zh-TW.md",
      ];

      async function renderManualDiagrams() {
        const root = document.getElementById("diagrams");
        const sources = [];

        for (const manual of manuals) {
          const response = await fetch(manual);
          if (!response.ok)
            throw new Error(`${manual}: HTTP ${response.status}`);

          const markdown = await response.text();
          for (const match of markdown.matchAll(/```mermaid\s*([\s\S]*?)```/g))
            sources.push({ manual, source: match[1].trim() });
        }

        for (const [index, item] of sources.entries()) {
          const heading = document.createElement("h2");
          heading.textContent = `${item.manual} diagram ${index + 1}`;
          const diagram = document.createElement("div");
          diagram.className = "mermaid";
          diagram.textContent = item.source;
          root.append(heading, diagram);
        }

        mermaid.initialize({ startOnLoad: false, securityLevel: "strict" });
        await mermaid.run({ nodes: root.querySelectorAll(".mermaid") });

        const rendered = root.querySelectorAll("svg").length;
        if (sources.length !== 4 || rendered !== sources.length)
          throw new Error(`expected 4 Mermaid SVGs, found ${rendered} from ${sources.length} sources`);

        document.getElementById("result").textContent = `PASS diagrams=${rendered}`;
        document.title = `PASS diagrams=${rendered}`;
      }

      renderManualDiagrams().catch((error) => {
        document.getElementById("result").textContent = `FAIL ${error.message}`;
        document.title = `FAIL ${error.message}`;
      });
    </script>
  </body>
</html>
