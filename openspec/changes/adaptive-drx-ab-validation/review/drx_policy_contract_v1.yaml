version: 1
status: frozen_after_review
scope: rrc_connected_c_drx

e2sm_rc:
  specification: O-RAN.WG3.TS.E2SM-RC-R005-v10.00
  control_service_style_id: 2
  control_service_style_name: Radio Resource Allocation Control
  control_action_id: 1
  control_action_name: DRX parameter configuration
  ran_parameters:
    - id: 1
      name: Long DRX Cycle Length
      required: true
  omitted_v1_parameters:
    - id: 2
      name: Short DRX Cycle Length
    - id: 3
      name: Short DRX Cycle Timer
  correlation_key: ric_request_id
  exact_value_encoding_status: needs_verification_against_ts_38_473

local_policy_record:
  required_fields:
    - schema_version
    - campaign_id
    - direction
    - window_id
    - policy_version
    - ric_request_id
    - rnti
    - sample_count
    - mean_interval_us
    - stddev_interval_us
    - lower_3sigma_us
    - upper_3sigma_us
    - median_interval_us
    - p95_interval_us
    - prediction_status
    - selected_profile_id
    - previous_profile_id
  constants:
    schema_version: 1
    sample_count: 30
    valid_for_arrivals: 30
    short_drx_enabled: false
    drx_inactivity_timer_ms: 20
    drx_slot_offset_1_over_32_ms: 0

approved_profiles:
  - id: drx-320-10
    long_cycle_ms: 320
    on_duration_ms: 10
  - id: drx-640-10
    long_cycle_ms: 640
    on_duration_ms: 10
  - id: drx-1280-20
    long_cycle_ms: 1280
    on_duration_ms: 20
  - id: drx-2560-20
    long_cycle_ms: 2560
    on_duration_ms: 20
  - id: drx-5120-40
    long_cycle_ms: 5120
    on_duration_ms: 40
  - id: drx-10240-40
    long_cycle_ms: 10240
    on_duration_ms: 40

selection_rule:
  adaptive_cycle: largest_approved_cycle_not_greater_than_lower_3sigma
  minimum_cycle_ms: 320
  fallback_profile_id: drx-320-10
  start_offset: align_next_predicted_mean_arrival_to_on_duration_start
  start_offset_status: needs_verification_against_sfn_and_apply_latency

guards:
  require_connected_ue: true
  require_monotonic_policy_version: true
  require_sample_count: 30
  require_approved_profile: true
  require_previous_profile_for_rollback: true
  require_on_duration_less_than_cycle: true
  require_rrc_reconfiguration_cooldown: true
  drx_command_enabled: false

reject_reasons:
  - invalid_schema_version
  - unknown_rnti
  - ue_not_connected
  - stale_policy_version
  - sample_count_not_30
  - unsupported_long_cycle
  - unsupported_on_duration
  - invalid_start_offset
  - prediction_out_of_bounds
  - cooldown_active
  - rollback_unavailable
  - e2_decode_error
  - gnb_apply_failed
  - rrc_completion_timeout

rollback:
  action: restore_previous_profile
  evidence_required:
    - dapp_rollback_decision_marker
    - gnb_drx_applied_marker
    - rrc_reconfiguration_complete_marker

markers:
  request: "[RedCap DRX][xApp request]"
  e2_ack: "[RedCap DRX][E2 ACK]"
  dapp_accept: "[RedCap DRX][dApp ACCEPT]"
  dapp_reject: "[RedCap DRX][dApp REJECT]"
  gnb_apply: "[RedCap DRX][gNB applied]"
  ue_config: "Configured Connected DRX"
  rrc_complete: "Received RRCReconfigurationComplete"
  rollback: "[RedCap DRX][rollback]"
