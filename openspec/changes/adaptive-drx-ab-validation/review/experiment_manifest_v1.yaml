version: 1
status: frozen_after_review
experiment: adaptive_c_drx_ab_v1

topology:
  ue_count: 1
  ue_type: redcap
  rrc_state: connected
  short_drx_enabled: false
  primary_drx_command_gate: false

campaigns:
  - id: arm-a-dl
    arm: A
    direction: downlink
  - id: arm-b-dl
    arm: B
    direction: downlink
  - id: arm-a-ul
    arm: A
    direction: uplink
  - id: arm-b-ul
    arm: B
    direction: uplink

arrival_population:
  arrivals_per_campaign: 330
  warmup_arrivals: 30
  scored_arrivals: 300
  scored_windows: 10
  arrivals_per_window: 30
  minimum_interval_ms: 300
  maximum_interval_ms: 10240
  trace_seed: required_at_run
  paired_arm_rule: A_and_B_use_the_same_seeded_interval_sequence_with_a_per_campaign_future_epoch
  trace_model:
    name: piecewise_truncated_normal_v1
    window_mean_ms: [640, 800, 1000, 1250, 1600, 2000, 2500, 3200, 4000, 5000, 6400]
    stddev_fraction_of_mean: 0.10
    clamp_to_interval_bounds: true
  source_of_truth: generated_trace_csv

arm_a:
  policy: fixed_profile_for_all_scored_arrivals
  baseline_profile_id: drx-320-10
  apply_count: 1

arm_b:
  bootstrap_profile_id: drx-320-10
  bootstrap_policy_version: 0
  bootstrap_requires_fresh_unconfigured_state: true
  history_size: 30
  forecast_horizon_arrivals: 30
  statistics:
    - mean
    - sample_stddev
    - lower_3sigma
    - upper_3sigma
    - median
    - p95
    - minimum
    - maximum
  selection_source: drx_policy_contract_v1.yaml
  clear_history_after: committed_policy_only
  retain_history_after: reject_or_timeout

traffic_generator:
  tool: iperf2
  transport: udp
  server_mode: persistent
  bytes_per_burst: 32768
  payload_bytes: 1200
  target_bitrate_bps: 10000000
  scheduling_option: --txstart-time
  latency_option: --trip-times
  client_rule: launch_before_scheduled_tx_time
  timestamp_rule: never_use_process_start_as_packet_arrival_time
  direction_rule:
    downlink: reverse_mode_server_to_ue
    uplink: normal_mode_ue_to_server
  availability_status: verify_iperf2_in_runtime_images_before_gate

metrics:
  primary:
    - scored_delivery_success_count
    - scheduled_to_first_receive_latency_ms
    - latency_median_ms
    - latency_p95_ms
    - latency_max_ms
    - pdcch_monitoring_slot_ratio
    - drx_active_time_slot_ratio
  secondary:
    - burst_goodput_mbps
    - udp_loss_percent
    - udp_jitter_ms
    - dl_harq_retransmission_count
    - ul_harq_retransmission_count
    - policy_apply_latency_ms
    - policy_reject_count
    - rollback_count
    - rrc_reconfiguration_count
    - rrc_reconfiguration_timeout_count
  claim_boundary: rf_simulation_energy_proxies_only

pass_boundary:
  require_all_300_scored_records: true
  require_correlated_policy_version: true
  require_xapp_request_marker: true
  require_e2_ack_marker: true
  require_dapp_decision_marker: true
  require_gnb_apply_marker: true
  require_ue_config_marker: true
  require_rrc_completion_marker: true
  missing_required_marker_result: partial_or_blocked
