Active_gNBs:
  - gNB-OAI
Asn1_verbosity: none
gNBs:

  - gNB_ID: 0xe00
    gNB_name: gNB-OAI
    # Tracking area code, 0x0000 and 0xfffe are reserved values
    min_rxtxtime: 6
    tracking_area_code: 1
    plmn_list:
      -
        mcc: 001
        mnc: 01
        mnc_length: 2
        snssaiList:
          -
            sst: 1
            sd: 0xffffff

    nr_cellid: 12345678
    # Physical parameters:
    do_CSIRS: 1
    do_SRS: 1
    first_active_bwp: 1
    # Gate D 5 MHz BWP profile: keep the 106 PRB carrier stable, but make BWP1 12 PRBs at 30 kHz SCS.
    bwp_list:
      -
        scs: 1
        bwpStart: 0
        bwpSize: 12
    #uess_agg_levels: [0,1,1,1,1]
    servingCellConfigCommon:
      #spCellConfigCommon
      - physCellId: 0
        #  downlinkConfigCommon
        #frequencyInfoDL
        # this is 3619.200 MHz
        absoluteFrequencySSB: 641280
        dl_frequencyBand: 78
        # this is 3611.280 MHz
        dl_absoluteFrequencyPointA: 640752
        #scs-SpecificCarrierList
        dl_offstToCarrier: 0
        # subcarrierSpacing
        # 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        dl_subcarrierSpacing: 1
        dl_carrierBandwidth: 106
        #initialDownlinkBWP
        #genericParameters
        # this is RBstart=0,L=51 (275*(L-1))+RBstart
        initialDLBWPlocationAndBandwidth: 13750
        # subcarrierSpacing
        # 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        initialDLBWPsubcarrierSpacing: 1
        #pdcch-ConfigCommon
        initialDLBWPcontrolResourceSetZero: 10
        initialDLBWPsearchSpaceZero: 0
        #uplinkConfigCommon
        #frequencyInfoUL
        ul_frequencyBand: 78
        #scs-SpecificCarrierList
        ul_offstToCarrier: 0
        # subcarrierSpacing
        # 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        ul_subcarrierSpacing: 1
        ul_carrierBandwidth: 106
        pMax: 20
        #initialUplinkBWP
        #genericParameters
        initialULBWPlocationAndBandwidth: 13750
        # subcarrierSpacing
        # 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        initialULBWPsubcarrierSpacing: 1
        #rach-ConfigCommon
        #rach-ConfigGeneric
        prach_ConfigurationIndex: 98
        #prach_msg1_FDM
        #0 = one, 1=two, 2=four, 3=eight
        prach_msg1_FDM: 0
        prach_msg1_FrequencyStart: 0
        zeroCorrelationZoneConfig: 13
        preambleReceivedTargetPower: -96
        #preamblTransMax (0...10) = (3,4,5,6,7,8,10,20,50,100,200)
        preambleTransMax: 6
        #powerRampingStep
        # 0=dB0,1=dB2,2=dB4,3=dB6
        powerRampingStep: 1
        #ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR
        #1=oneeighth,2=onefourth,3=half,4=one,5=two,6=four,7=eight,8=sixteen
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4
        #one (0..15) 4,8,12,16,...60,64
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB: 14
        #ra_ContentionResolutionTimer
        #(0..7) 8,16,24,32,40,48,56,64
        ra_ContentionResolutionTimer: 7
        rsrp_ThresholdSSB: 19
        #prach-RootSequenceIndex_PR
        #1 = 839, 2 = 139
        prach_RootSequenceIndex_PR: 2
        prach_RootSequenceIndex: 1
        # SCS for msg1, can only be 15 for 30 kHz < 6 GHz, takes precendence over the one derived from prach-ConfigIndex
        msg1_SubcarrierSpacing: 1
        # restrictedSetConfig
        # 0=unrestricted, 1=restricted type A, 2=restricted type B
        restrictedSetConfig: 0
        msg3_DeltaPreamble: 1
        p0_NominalWithGrant: -90
        # pucch-ConfigCommon setup :
        # pucchGroupHopping
        # 0 = neither, 1= group hopping, 2=sequence hopping
        pucchGroupHopping: 0
        hoppingId: 40
        p0_nominal: -90
        ssb_PositionsInBurst_Bitmap: 1

        # ssb_periodicityServingCell
        # 0 = ms5, 1=ms10, 2=ms20, 3=ms40, 4=ms80, 5=ms160, 6=spare2, 7=spare1
        ssb_periodicityServingCell: 2

        # dmrs_TypeA_position
        # 0 = pos2, 1 = pos3
        dmrs_TypeA_Position: 0

        # subcarrierSpacing
        # 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        subcarrierSpacing: 1


        #tdd-UL-DL-ConfigurationCommon
        # subcarrierSpacing
        # 0=kHz15, 1=kHz30, 2=kHz60, 3=kHz120
        referenceSubcarrierSpacing: 1
        # pattern1
        # dl_UL_TransmissionPeriodicity
        # 0=ms0p5, 1=ms0p625, 2=ms1, 3=ms1p25, 4=ms2, 5=ms2p5, 6=ms5, 7=ms10
        dl_UL_TransmissionPeriodicity: 6
        nrofDownlinkSlots: 7
        nrofDownlinkSymbols: 6
        nrofUplinkSlots: 2
        nrofUplinkSymbols: 4

        ssPBCH_BlockPower: -25
        dl_DataToUL_ACK: [6, 6, 6, 6, 6, 6, 6, 6]   # need research

# SIB1 - SIB4 column

    RedCap:

        cellBarredRedCap1Rx_r17: 1 # The 1 RX ue can into this cell ? 1: yes 0 : no
        cellBarredRedCap2Rx_r17: 1 # The 2 Rx ue can into this cell?  1: yes 0 : no
        halfDuplexRedCapAllowed_r17: 1
        redcap_inactive_allowed: 1 # Enable local RedCap SDT / RRC_INACTIVE FSM hooks
        intraFreqReselectionRedCap_r17: 0 # Premit the ue can do the cell reselection
                                          # in the same fequency
                                          # for move ue , need shark hand cell
        # 5 MHz at 30 kHz SCS maps to 12 PRBs for the local eRedCap PUSCH/PDSCH profile [Needs Verification].
        redCapInitialBWP_r17:
          initialDLBWPStart_r17: 0
          initialDLBWPSize_r17: 12
          initialDLBWPSubcarrierSpacing_r17: 1
          coreset0_redcap_mode_r17: 1 # 0: Case A (type0 CSS), 1: Case B (edge-only commonControlResourceSet)
          initialDLBWPControlResourceSetZero_r17: 10
          initialDLBWPSearchSpaceZero_r17: 0
          initialULBWPStart_r17: 0
          initialULBWPSize_r17: 12
          initialULBWPSubcarrierSpacing_r17: 1
          initialULPUCCH_ResourceCommonRedCap_r17: 0

    TIMERS:
      -
        t300: 1000 # The rrc message send , waiting time out
        t301: 1000 # send the x message , that gave up if waiting over 301 time

        # RF Spike parameter
        # The RRM coording parameter
        t310: 1000 # if channel quality is bad , will used this timer to rego procell (connetion falie -> rebuild)
        n310: 1 # if t310 fail once , that ue is fail

        t311: 30000 # ue try reconnect timer windows , after n310 fail is true
        n311: 1 # good quality, if susscess have onece

        # timer RRC relase and reconfigration process
        # hide ue inif wait
        t319: 1000


        # Ths ue streams channel
        # Like message high speed way
    SCTP:
      -
        SCTP_INSTREAMS: 2
        SCTP_OUTSTREAMS: 2


    # AMF parameters:
    amf_ip_address:
      - ipv4: 192.168.70.132

  # for self
    NETWORK_INTERFACES:
      GNB_IPV4_ADDRESS_FOR_NG_AMF: 192.168.70.140
      GNB_IPV4_ADDRESS_FOR_NGU: 192.168.70.140
      GNB_PORT_FOR_S1U: 2152 # Spec 2152

MACRLCs:
  -
    num_cc: 1
    tr_s_preference: local_L1
    tr_n_preference: local_RRC
    pusch_TargetSNRx10: 200 # 150 -> 200
    pucch_TargetSNRx10: 200

L1s:
  -
    num_cc: 1
    tr_n_preference: local_mac
    prach_dtx_threshold: 200  # 120 ->200
    pucch0_dtx_threshold: 150 # 100 -> 150
    ofdm_offset_divisor: 8 #set this to UINT_MAX for offset 0

# This way is only ru = 0
# The ruid like the mapping ue to which ru station
# Because this tag only have one RU so, need the
RUs:
  -
    local_rf: yes
    nb_tx: 1
    nb_rx: 1
    att_tx: 12
    att_rx: 12
    bands: [78]
    max_pdschReferenceSignalPower: -27
    max_rxgain: 114
    eNB_instances: [0] # The first station
    clock_src: internal

# This way is setting the channel to do the simluaiton
rfsimulator:
  serveraddr: server
  serverport: 4043
  options: [] #("saviq"); or/and "chanmod"
  modelname: AWGN
  IQfile: /tmp/rfsimulator.iqs

security:
  # preferred ciphering algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nea0, nea1, nea2, nea3
  ciphering_algorithms: [nea0]

  # preferred integrity algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nia0, nia1, nia2, nia3
  integrity_algorithms: [nia2, nia0]

  # setting 'drb_ciphering' to "no" disables ciphering for DRBs, no matter
  # what 'ciphering_algorithms' configures; same thing for 'drb_integrity'
  drb_ciphering: yes
  drb_integrity: no

log_config:
  global_log_level: info
  hw_log_level: info
  phy_log_level: info
  mac_log_level: info
  rlc_log_level: info
  pdcp_log_level: info
  rrc_log_level: info
  ngap_log_level: debug
  f1ap_log_level: debug

e2_agent:
  near_ric_ip_addr: 192.168.70.180
  #sm_dir = /path/where/the/SMs/are/located/
  sm_dir: /usr/local/lib/flexric/
