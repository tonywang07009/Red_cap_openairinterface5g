services:
    nearRT-RIC:
        #image: ${REGISTRY-oaisoftwarealliance/}oai-flexric:${FLEXRIC_TAG:-develop}
        image: oai-flexric:custom-dev
        pull_policy: never # don't go to network download (don't got to the dockerhub)
        # This is from this file 
        build:
            context: .
            dockerfile: Dockerfile.dev  # The rebuild content
            args:
                FLEXRIC_TAG: ${FLEXRIC_TAG:-develop} # 這邊可以在進行更換 例如換成 FLEXRIC_TAG: 2.15 之類的版本
            
        container_name: nearRT-RIC_redcap
        privileged: true  # The Permissions problem
        networks:
            public_net:
                ipv4_address: 192.168.70.180
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
                # left : local role
                # right : container role
                # The flexric rotuer
            #1. the source dir
            - /home/tonywang/OAI/flexric:/flexric_src
            # :ro -> is read only
        healthcheck:
            test: /bin/bash -c "pgrep nearRT-RIC"
            interval: 10s
            timeout: 5s
            retries: 5
            

    xapp-rc-moni:
        # image: ${REGISTRY-oaisoftwarealliance/}oai-flexric:${FLEXRIC_TAG:-develop}
        image: oai-flexric:custom-dev
        command: "stdbuf -o0 /usr/local/flexric/xApp/c/monitor/xapp_rc_moni"
        container_name: xapp-rc-moni_redcap
        depends_on:
            - nearRT-RIC
            - oai-gnb
        networks:
            public_net:
                ipv4_address: 192.168.70.184
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
        healthcheck:
            test: /bin/bash -c "pgrep xapp_rc_moni"
            interval: 10s
            timeout: 5s

    xapp-kpm-moni:
        # image: ${REGISTRY-oaisoftwarealliance/}oai-flexric:${FLEXRIC_TAG:-develop}
        image: oai-flexric:custom-dev
        command: "stdbuf -o0 /usr/local/flexric/xApp/c/monitor/xapp_kpm_moni"
        container_name: xapp-kpm-moni_redcap
        depends_on:
            - nearRT-RIC
            - oai-gnb
        networks:
            public_net:
                ipv4_address: 192.168.70.185
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
        healthcheck:
            test: /bin/bash -c "pgrep xapp_kpm_moni"
            interval: 10s
            timeout: 5s

    xapp-kpm-rc:
        # image: ${REGISTRY-oaisoftwarealliance/}oai-flexric:${FLEXRIC_TAG:-develop}
        image: oai-flexric:custom-dev
        command: "stdbuf -o0 /usr/local/flexric/xApp/c/kpm_rc/xapp_kpm_rc"
        container_name: xapp-kpm-rc_redcap
        depends_on:
            - nearRT-RIC
            - oai-gnb
        networks:
            public_net:
                ipv4_address: 192.168.70.186
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
        healthcheck:
            test: /bin/bash -c "pgrep xapp_kpm_rc"
            interval: 10s
            timeout: 5s

    xapp-gtp-mac-rlc-pdcp-moni:
        # image: ${REGISTRY-oaisoftwarealliance/}oai-flexric:${FLEXRIC_TAG:-develop}
        image: oai-flexric:custom-dev
        command: "stdbuf -o0 /usr/local/flexric/xApp/c/monitor/xapp_gtp_mac_rlc_pdcp_moni"
        container_name: xapp-gtp-mac-rlc-pdcp-moni_redcap
        depends_on:
            - nearRT-RIC
            - oai-gnb
        networks:
            public_net:
                ipv4_address: 192.168.70.187
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
        healthcheck:
            test: /bin/bash -c "pgrep -f xapp_gtp_mac_rlc_pdcp_moni"
            interval: 10s
            timeout: 5s

    oai-gnb:
        image: ${REGISTRY-oaisoftwarealliance/}${GNB_IMG:-oai-gnb}:${TAG:-develop}
        privileged: true
        container_name: rfsim5g-oai-gnb_redcap
        environment:
            USE_ADDITIONAL_OPTIONS: >
                -E --rfsim --log_config.global_log_options level,nocolor,time

            ASAN_OPTIONS: detect_leaks=0

        depends_on:
            - nearRT-RIC
            
        networks:
            public_net:
                ipv4_address: 192.168.70.140
                # 70.151
        volumes:
            - ${GNB_REDCAP_CONFIG:-../../conf_files/gnb.sa.band78.fr1.106PRB.usrpb210.redcap.yaml}:/opt/oai-gnb/etc/gnb.yaml
            # The /etc/gnb.yaml -> the file type need alament
        healthcheck:
            test: /bin/bash -c "pgrep nr-softmodem"
            interval: 10s
            timeout: 5s
            retries: 5
    oai-nr-ue1:
        image: ${REGISTRY-oaisoftwarealliance/}${NRUE_IMG:-oai-nr-ue}:${TAG:-develop}
        container_name: rfsim5g-oai-nr-ue1_redcap
        cap_drop:
            - ALL
        cap_add:
            - NET_ADMIN  # for interface bringup
            - NET_RAW    # for ping
            - SYS_NICE
        environment:
            # The ">" is change line symbol
            # This way 192.168.71.140 --|change|--> 192.168.70.140
            
            USE_ADDITIONAL_OPTIONS: > 
                                    -E --rfsim -r 106 --numerology 1 
                                    --uicc0.imsi 001010000000001
                                    -C 3630360000 
                                    --ssb 144
                                    --rfsimulator.serveraddr 192.168.70.140 
                                    --log_config.global_log_options level,nocolor,time
                                    --telnetsrv --telnetsrv.listenaddr 192.168.71.150 --telnetsrv.listenport 8091
        depends_on:
            - oai-gnb
        networks:
            public_net:
                ipv4_address: 192.168.71.150
        devices:
             - /dev/net/tun:/dev/net/tun
        volumes:
            - ../../conf_files/nrue_recap/nrue1.uicc.yaml:/opt/oai-nr-ue/etc/nr-ue.yaml
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            start_period: 10s
            start_interval: 500ms
            interval: 10s
            timeout: 5s
            retries: 5
