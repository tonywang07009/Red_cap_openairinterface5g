services:
    nearRT-RIC:
        #image: ${REGISTRY-oaisoftwarealliance/}oai-flexric:${FLEXRIC_TAG:-develop}
        image: oai-flexric:custom-dev
        pull_policy: never # don't go to network download (don't got to the dockerhub)
        build:
            context: .
            dockerfile: Dockerfile.dev  # The rebuild content
            args:
                FLEXRIC_TAG: ${FLEXRIC_TAG:-develop} # 這邊可以在進行更換 例如換成 FLEXRIC_TAG: 2.15 之類的版本
            
        container_name: nearRT-RIC
        privileged: true  # The Permissions problem
        networks:
            public_net:
                ipv4_address: 192.168.70.180
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
                # left : local role
                # right : container role
                # The flexric rotuer
            #1. the source dir
            - /home/tonywang/OAI/flexric:/flexric_src
            # :ro -> is read only
        # keep the motived
        command: sleep infinity
            
        healthcheck:
            test: ["CMD-SHELL", "echo 'I am ready for compilation'"]
            # test: /bin/bash -c "pgrep nearRT-RIC"
            interval: 10s
            timeout: 5s
            retries: 5
            

    xapp-rc-moni:
        # image: ${REGISTRY-oaisoftwarealliance/}oai-flexric:${FLEXRIC_TAG:-develop}
        image: oai-flexric:custom-dev
        command: "stdbuf -o0 /usr/local/flexric/xApp/c/monitor/xapp_rc_moni"
        container_name: xapp-rc-moni
        depends_on:
            - nearRT-RIC
            - oai-gnb
        networks:
            public_net:
                ipv4_address: 192.168.70.184
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
        healthcheck:
            test: /bin/bash -c "pgrep xapp_rc_moni"
            interval: 10s
            timeout: 5s

    xapp-kpm-moni:
        # image: ${REGISTRY-oaisoftwarealliance/}oai-flexric:${FLEXRIC_TAG:-develop}
